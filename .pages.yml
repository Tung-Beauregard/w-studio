            required: true
            options:
              maxlength: 24
          - name: "filterNote"
            label: "分類列旁提示"
            type: "string"
            required: true
            options:
              maxlength: 60
      - name: "tools"
        label: "工具下載區塊"
        type: "object"
        required: true
        fields:
          - name: "eyebrow"
            label: "區塊編號與英文小字"
            type: "string"
            required: true
            options:
              maxlength: 80
          - name: "titleLead"
            label: "標題：前段"
            type: "string"
            required: true
            options:
              maxlength: 24
          - name: "titleAccent"
            label: "標題：後段"
            type: "string"
            required: true
            options:
              maxlength: 24
          - name: "description"
            label: "區塊說明"
            type: "text"
            required: true
            options:
              maxlength: 200
            description: "請填純文字，不支援 HTML 或 Markdown 語法。"
          - name: "badge"
            label: "區塊標籤"
            type: "string"
            required: true
            options:
              maxlength: 16
          - name: "note"
            label: "下載提示"
            type: "text"
            required: true
            options:
              maxlength: 300
            description: "請填純文字，不支援 HTML 或 Markdown 語法。"
          - name: "emptyEyebrow"
            label: "準備中：英文小字"
            type: "string"
            required: true
            options:
