          - name: "eyebrow"
            label: "區塊編號與英文小字"
            type: "string"
            required: true
            options:
              maxlength: 80
          - name: "titleLead"
            label: "標題：前段"
            type: "string"
            required: true
            options:
              maxlength: 24
          - name: "titleAccent"
            label: "標題：後段"
            type: "string"
            required: true
            options:
              maxlength: 24
          - name: "description"
            label: "區塊說明"
            type: "text"
            required: true
            options:
              maxlength: 200
            description: "請填純文字，不支援 HTML 或 Markdown 語法。"
          - name: "allProjectsLabel"
            label: "GitHub 專案連結文字"
