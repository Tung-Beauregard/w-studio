# W AI Studio — Pages CMS
# Plain-text copy, project visibility and display order. Fixed objects preserve project settings.
# https://pagescms.org/docs/configuration/
content:
  - name: "home"
    label: "首頁文案"
    type: "file"
    path: "content/home.json"
    format: "json"
    fields:
      - name: "projectSelectionConfigured"
        type: "boolean"
        hidden: true
        readonly: true
        default: true
      - name: "projectOrder"
        label: "專案卡片順序"
        type: "object"
        required: false
        description: "拖曳把手調整順序；按 X 移除可隱藏首頁卡片，再按 Save／儲存。要恢復時按 Add／新增並選擇專案，請勿重複選取。原本文案會保留；全部移除代表不展示任何專案。"
        list:
          min: 0
          max: 8
          collapsible: false
        fields:
          - name: "id"
            label: "專案"
            type: "select"
            required: true
            options:
              values:
                - name: "language"
                  label: "泰語 × 繁體中文學習"
                - name: "astral"
                  label: "Astral Notes 星語"
                - name: "line-zh-th"
                  label: "中泰翻譯 LINE 機器人"
                - name: "line-zh-en-ko"
                  label: "中英韓翻譯 LINE 機器人"
                - name: "agent-hub"
                  label: "Mycelint"
                - name: "lab-demo"
                  label: "實驗室管理系統"
                - name: "ordering-demo"
                  label: "點餐系統 Demo"
                - name: "instrument-principles"
                  label: "儀器原理互動教室"
      - name: "nav"
        label: "導覽列"
        type: "object"
        required: true
        fields:
          - name: "about"
            label: "關於連結文字"
            type: "string"
            required: true
            options:
              maxlength: 16
          - name: "projects"
            label: "專案連結文字"
            type: "string"
            required: true
            options:
              maxlength: 16
          - name: "tools"
            label: "下載連結文字"
            type: "string"
            required: true
            options:
              maxlength: 16
      - name: "hero"
        label: "首頁主視覺"
        type: "object"
        required: true
        fields:
          - name: "eyebrow"
            label: "主標題上方小字"
            type: "string"
            required: true
            options:
              maxlength: 100
          - name: "titleLine1"
            label: "主標題：第一行"
            type: "string"
            required: true
            options:
              maxlength: 24
          - name: "titleLead"
            label: "主標題：第二行前段"
            type: "string"
            required: true
            options:
              maxlength: 16
          - name: "titleAccent"
            label: "主標題：薄荷綠重點文字"
            type: "string"
            required: true
            options:
              maxlength: 24
          - name: "titleEnd"
            label: "主標題：結尾標點"
            type: "string"
            required: false
            description: "可留白；留白時不顯示結尾標點。"
            options:
              maxlength: 4
          - name: "descriptionLine1"
            label: "介紹文字：第一行"
            type: "string"
            required: true
            options:
              maxlength: 100
          - name: "descriptionLine2"
            label: "介紹文字：第二行"
            type: "string"
            required: true
            options:
              maxlength: 100
          - name: "primaryButton"
            label: "主要按鈕文字"
            type: "string"
            required: true
            options:
              maxlength: 24
          - name: "secondaryButton"
            label: "功能介紹按鈕文字"
            type: "string"
            required: true
            options:
              maxlength: 24
          - name: "tags"
            label: "三個特色標籤"
            type: "string"
            required: true
            options:
              maxlength: 16
            list:
              min: 3
              max: 3
            description: "固定 3 項，請保留排列順序並使用純文字。"
          - name: "studioLabel"
            label: "工作室文字"
            type: "string"
            required: true
            options:
              maxlength: 24
          - name: "exploreLabel"
            label: "向下探索文字"
            type: "string"
            required: true
            options:
              maxlength: 16
      - name: "projectSection"
        label: "精選專案區塊"
